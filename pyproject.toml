[project]
name = "sep-evidence-workbench"
version = "0.1.0"
description = "Graph-assisted standards evidence workbench for patent analysts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.38,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pdfplumber>=0.11.8,<1",
  "pypdfium2>=5.1,<6",
  "sentence-transformers>=5.1,<6",
  "numpy>=2.3,<3",
  "python-docx>=1.2,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
