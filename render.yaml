# LexNorm workbench — Docker web service for hiring-manager review.
# Free plan: no persistent disk (disks require paid compute). On spin-down the
# filesystem resets; docker-entrypoint re-seeds SQLite from the image.
#
# Render: New → Blueprint → this repo → Blueprint Name e.g. "lexnorm"
# Then fill MODEL_API_KEY / MAPPER_MODEL / REVIEWER_MODEL when prompted.

services:
  - type: web
    name: lexnorm-workbench
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_API_BASE
        value: https://api.openai.com/v1
      - key: MAPPER_MODEL
        value: gpt-4o-mini
      - key: REVIEWER_MODEL
        value: gpt-4o
      - key: MODEL_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_RUN_BUDGET_USD
        value: "1.50"
      - key: APP_PUBLIC_BASE_URL
        value: https://lexnorm-workbench.onrender.com
